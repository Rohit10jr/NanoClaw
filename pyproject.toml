[project]
name = "nanoclaw"
version = "0.1.0"
description = "A minimal personal AI agent, rebuilt layer by layer from nanobot's core ideas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "ddgs>=9.16.1,<10.0.0",
    "httpx>=0.28.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "loguru>=0.7.3,<1.0.0",
    "lxml-html-clean>=0.4.0,<1.0.0",
    "openai>=2.8.0",
    "prompt-toolkit>=3.0.50,<4.0.0",
    "pyyaml>=6.0",
    "readability-lxml>=0.8.4,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "tiktoken>=0.12.0,<1.0.0",
]

[project.scripts]
nanoclaw = "nanoclaw.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
